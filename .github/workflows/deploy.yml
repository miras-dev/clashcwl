name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Stage only what the browser needs, then sync that. An allowlist means a
      # new file (or a stray key) is never published just by existing in the repo.
      - name: Stage public files
        run: |
          mkdir -p _site
          cp *.html _site/
          cp -r css js assets _site/
          cp robots.txt sitemap.xml _site/
          # Accumulated ranked-battle history, written by the collect-battles
          # workflow. Absent until that has run at least once.
          [ -d data ] && cp -r data _site/ || true
          # Legend Bases is parked until it has a data source behind it.
          rm -f _site/bases.html

      - name: Upload to S3
        run: |
          aws s3 sync _site s3://${{ secrets.S3_BUCKET }} --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
